[package]
name = "podstream"
version = "0.1.0"
edition = "2021"
description = "Stream macOS system audio to AirPlay receivers (HomePod) with low latency, from the CLI"

[dependencies]
alac-encoder = "0.3.0"
anyhow = "1"
base64 = "0.23.1"
block2 = "0.6.2"
chacha20poly1305 = "0.11.0"
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.12"
mdns-sd = "0.13"
num-bigint = "0.5.1"
objc2 = "0.6.5"
objc_id = "0.1.1"
plist = "1.10.3"
rand = "0.10.3"
rand_core = "0.10.1"
screencapturekit = "11.1.2"
screencapturekit-sys = "0.2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
srp = "0.6.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
